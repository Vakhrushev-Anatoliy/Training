<title>Тренировки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: one phone column — day header, exercise cards in the order of the routine, history at the bottom */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202A; --muted:#5E6B78; --line:#D8DEE5;
  --accent:#2E56D8; --accent-soft:#E2E9FB; --ok:#1E8A5A; --ok-soft:#DDF2E7;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --ink:#E8EDF2; --muted:#93A0AD; --line:#2A3540;
  --accent:#7C9BFF; --accent-soft:#1F2B4A; --ok:#4CC88E; --ok-soft:#163327; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --ink:#E8EDF2; --muted:#93A0AD; --line:#2A3540;
  --accent:#7C9BFF; --accent-soft:#1F2B4A; --ok:#4CC88E; --ok-soft:#163327; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

header{display:flex;flex-direction:column;gap:10px}
.daybar{display:flex;align-items:center;gap:8px}
.daybar h1{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-wrap:balance}
.daybar small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.icon-btn:disabled{opacity:.35;cursor:default}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.rules{font-size:13px;color:var(--muted);margin:0}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.done{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.ex-head{display:flex;gap:10px;align-items:baseline}
.ex-n{font-family:var(--display);font-size:12px;color:var(--muted);min-width:18px}
.ex-title{flex:1;min-width:0}
.ex-title h2{margin:0;font-size:16px;font-weight:700}
.ex-title p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ts{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 7px;white-space:nowrap}
.ts.new{color:var(--ok);background:var(--ok-soft)}

.side{display:flex;align-items:center;gap:10px}
.side-label{width:58px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.side-label.none{display:none}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.counter button:active{transform:scale(.95)}
.counter input{width:64px;height:46px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-family:var(--display);font-size:20px;font-weight:700}
.target{flex:1;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.target b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}
.target.hit b{color:var(--ok)}

.rest{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);align-self:center;border:none;border-radius:999px;background:var(--accent);color:#fff;padding:12px 22px;font-weight:700;box-shadow:0 6px 20px rgba(20,40,90,.25)}
.rest.running{background:var(--ink);color:var(--bg)}

section.hist{display:flex;flex-direction:column;gap:8px}
section.hist h3{margin:6px 0 0;font-family:var(--display);font-size:15px}
.hist-table{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr:last-child td{border-bottom:none}
.empty{padding:14px;color:var(--muted);font-size:13px}
.sync{font-size:13px;color:var(--muted);margin:0}
.sbcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sb{display:flex;flex-direction:column;gap:8px}
.sb-note{margin:0;font-size:13px}
.sb-in{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
.backup-row{display:flex;gap:8px;flex-wrap:wrap}
.bk{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.bk.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:4px 0 0}
.sec-h h2{margin:0;font-family:var(--display);font-size:16px;flex:1}
.sec-h span{font-size:12px;color:var(--muted)}
.swim-top{display:flex;align-items:baseline;gap:8px}
.swim-top h3{margin:0;font-size:16px;flex:1}
.swim-top b{font-family:var(--display);font-size:15px;color:var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px}
.badge.test{color:#fff;background:#D8452E}
.sets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sets li{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.sets li:last-child{border-bottom:none}
.sets .vol{font-family:var(--display);font-weight:700;font-size:14px}
.sets .txt{font-size:13.5px}
.sets .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.z{font-weight:700;border-radius:5px;padding:0 5px;font-size:12px}
.z1{background:#E3EEF5;color:#2D5B78}.z2{background:#DDF2E7;color:#1E7A50}.z3{background:#FBEFD9;color:#9A5B00}.z4{background:#FBE1DC;color:#B23A22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .z1{background:#1C2E3B;color:#9CC8E6}:root:not([data-theme="light"]) .z2{background:#163327;color:#7FD9AA}:root:not([data-theme="light"]) .z3{background:#3A2C12;color:#F2C46B}:root:not([data-theme="light"]) .z4{background:#3E1E18;color:#FF9C86}}
.note{font-size:13px;color:var(--muted);margin:0}
.udar{position:relative;overflow:hidden;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#FF7A1A,#E8452C);color:#fff}
.udar.cold{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.udar-top{display:flex;align-items:center;gap:12px}
.udar-fire{font-size:38px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2))}
.udar.cold .udar-fire{filter:grayscale(1);opacity:.5}
.udar-t{flex:1;min-width:0}
.udar-t small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.udar-t b{display:block;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.udar-best{text-align:right;font-size:11px;opacity:.85;line-height:1.3}
.udar-best b{display:block;font-family:var(--display);font-size:16px}
.udar-msg{margin:0;font-size:13.5px;font-weight:600}
.udar-week{display:flex;gap:6px;justify-content:space-between}
.udar-week span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;opacity:.9}
.udar-week i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:rgba(255,255,255,.22);border:2px solid transparent}
.udar-week i.on{background:#fff;color:#E8452C}
.udar-week i.today{border-color:#fff}
.udar.cold .udar-week i{background:var(--bg);border:2px solid var(--line)}
.udar.cold .udar-week i.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.udar.cold .udar-week i.today{border-color:var(--accent)}
.udar-goal{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.udar-goal .gbar{height:7px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.udar.cold .udar-goal .gbar{background:var(--line)}
.udar-goal .gbar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .4s}
.udar.cold .udar-goal .gbar i{background:var(--accent)}
.udar-badges{display:flex;flex-wrap:wrap;gap:6px}
.udar-badges span{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.22)}
.udar-badges span.lock{opacity:.45}
.udar.cold .udar-badges span{background:var(--bg);border:1px solid var(--line)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:60;max-width:92vw;background:#16202A;color:#fff;border-radius:16px;padding:14px 18px;font-weight:700;font-size:15px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
#toast.show{transform:translate(-50%,0)}
#toast small{display:block;font-weight:600;font-size:12.5px;opacity:.8;margin-top:2px}
.swim-log{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.chk.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chk input{width:18px;height:18px;accent-color:var(--ok);margin:0}
select.sb-in{width:auto;height:42px}
.watch-btn{border:none;border-radius:12px;background:var(--ink);color:var(--bg);padding:11px 14px;font-weight:700}
.rb-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rb-row:last-child{border-bottom:none}
.rb-row input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.rb-row label{flex:1;font-size:14px;font-weight:600;cursor:pointer}
.rb-row label small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.rb-row .rx{font-family:var(--display);font-size:13px;white-space:nowrap}
details.zones summary{cursor:pointer;font-weight:700;font-size:14px}
details.zones table{margin-top:8px;font-size:12px}
.future .counter,.future .rb-row input{opacity:.4;pointer-events:none}
#watch{position:fixed;inset:0;background:#000;color:#fff;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
#watch .w{width:100%;max-width:420px;padding:18px 14px 30px;font-family:var(--body)}
#watch .wh{font-family:var(--display);font-size:20px;color:#FFD84D;margin:0 0 4px}
#watch .ws{font-size:15px;color:#aaa;margin:0 0 10px}
#watch ol{margin:0;padding:0;list-style:none;counter-reset:w}
#watch li{counter-increment:w;font-size:22px;font-weight:700;line-height:1.25;padding:7px 0;border-bottom:1px solid #333;font-variant-numeric:tabular-nums}
#watch li::before{content:counter(w) ". ";color:#777}
#watch .hint{font-size:12px;color:#666;margin-top:14px;text-align:center}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="daybar">
      <button class="icon-btn" id="prev" aria-label="Предыдущий день">‹</button>
      <h1 id="dayTitle">Сегодня<small id="dayDate"></small></h1>
      <button class="icon-btn" id="next" aria-label="Следующий день">›</button>
    </div>
  </header>

  <div class="sec-h"><h2>Зарядка</h2><span id="zInfo"></span></div>
  <div id="udar"></div>
  <div class="summary">
    <div class="stat"><b class="num" id="sDone">0/9</b><span>норма выполнена</span></div>
    <div class="stat"><b class="num" id="sTotal">0</b><span>повторов за день</span></div>
    <div class="stat"><b class="num" id="sStreak">0</b><span>ударный режим</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <p class="rules">Каждое упражнение до мышечного отказа, отдых 10 сек. Цель — прошлый результат +1.</p>
  <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>

  <div id="rubberBox"></div>

  <div class="sec-h"><h2>Бассейн</h2><span id="blockInfo"></span></div>
  <div class="card" id="swim"></div>

  <button class="rest" id="rest">Отдых 10 сек</button>

  <section class="hist">
    <h3>История</h3>
    <div class="hist-table" id="hist"></div>
  </section>
  <section class="hist">
    <h3>Синхронизация и копии</h3>
    <div class="sbcard">
      <p class="sync" id="sync"></p>
      <div id="sbBox" class="sb"></div>
      <div class="backup-row">
        <button class="bk" id="exp">Сохранить копию в файл</button>
        <label class="bk" for="imp">Восстановить из файла</label>
        <input type="file" id="imp" accept=".json,application/json" hidden>
      </div>
    </div>
  </section>
</div>
<div id="watch" hidden></div>
<div id="toast" role="status"></div>
<p id="appVer" style="text-align:center;font-size:11.5px;color:var(--muted);margin:-24px 0 24px"></p>

<script>
const EX = [
  {id:"squat",  name:"Глубокие приседания", hint:"Держитесь за дверной проём"},
  {id:"bridge", name:"Мостик", hint:"У стены"},
  {id:"pushup", name:"Глубокие отжимания", hint:"Можно с подушкой под колени"},
  {id:"dips",   name:"Отжимания на трицепс от стула", hint:"Спиной к стулу, руки на краю сиденья, локти назад. Опускайтесь до угла 90° в локтях"},
  {id:"abs",    name:"Протяжки на пресс", hint:""},
  {id:"bend",   name:"Наклоны у стены", hint:"На левую и правую сторону", sides:true},

function merge(remote){
  const out = {...state.days};
  for (const [d, r] of Object.entries(remote || {})) {
    if (!out[d] || (r._t || 0) >= (out[d]._t || 0)) out[d] = r;

  return out;

const base = () => cfg.url.replace(/\/+$/, "");
async function api(path, opts = {}, auth = true){
  const h = {"apikey": cfg.key, "Content-Type": "application/json", ...(opts.headers || {})};
  if (auth && session) h["Authorization"] = "Bearer " + session.access_token;
  const r = await fetch(base() + path, {...opts, headers: h});
  const txt = await r.text(); let body = null; try { body = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) { const err = new Error((body && (body.msg || body.message || body.error_description)) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return body;
}
function takeSession(t){
  const p = JSON.parse(atob(t.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
  session = {access_token: t.access_token, refresh_token: t.refresh_token,
             expires_at: Date.now() + (t.expires_in || 3600) * 1000, uid: p.sub, email: p.email || (t.user && t.user.email) || pendingEmail};
  lsSet(SES, session);
}
async function ensureFresh(){
  if (!session) return false;
  if (Date.now() < session.expires_at - 60000) return true;
  try { takeSession(await api("/auth/v1/token?grant_type=refresh_token", {method:"POST", body: JSON.stringify({refresh_token: session.refresh_token})}, false)); return true; }
  catch(e){ if (e.status === 400 || e.status === 401) { session = null; lsSet(SES, null); renderSync(); } return false; }
}
async function pull(){
  if (!cfg || !await ensureFresh()) return;
  try {
    syncEl.textContent = "Синхронизация…";
    const rows = await api("/rest/v1/workout_log?select=days&user_id=eq." + session.uid);
    const remote = rows && rows[0] ? rows[0].days : {};
    const before = JSON.stringify(state.days);
    state.days = merge(remote);
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
    if (JSON.stringify(state.days) !== before) render();
    if (JSON.stringify(remote) !== JSON.stringify(state.days)) await push(); else stamp();
  } catch(e) { syncEl.textContent = "Нет связи с Supabase: " + e.message + ". Данные сохранены на телефоне."; }
}
async function push(){
  if (!cfg || !await ensureFresh()) return;
  try {
    syncEl.textContent = "Сохраняю…";

      document.getElementById("sbSend").onclick = async () => {
        const email = document.getElementById("sbEmail").value.trim(); if (!email.includes("@")) return;
        try { await api("/auth/v1/otp?redirect_to=" + encodeURIComponent(location.href.split("#")[0]), {method:"POST", body: JSON.stringify({email, create_user: true})}, false);
              pendingEmail = email; renderSync(); }
        catch(e){ syncEl.textContent = "Не удалось отправить письмо: " + e.message; }
      };
      document.getElementById("sbReset").onclick = () => { cfg = null; lsSet(CFG, null); renderSync(); };
    }
  } else {
    sb.innerHTML = `<p class="sb-note">Вход: ${(session.email||"").replace(/</g,"")}</p>
      <div class="backup-row"><button class="bk" id="sbSync">Синхронизировать</button><button class="bk" id="sbOut">Выйти</button></div>
      <p class="sb-note">Пароль для входа с иконки на экране «Домой» (там ссылка из письма не работает):</p>
      <input id="sbNewPass" class="sb-in" type="password" autocomplete="new-password" placeholder="Новый пароль, от 6 символов">
      <div class="backup-row"><button class="bk" id="sbSetPass">Задать пароль</button></div>`;
    document.getElementById("sbSync").onclick = pull;
    document.getElementById("sbSetPass").onclick = async () => {
      const password = document.getElementById("sbNewPass").value;
      if (password.length < 6) { syncEl.textContent = "Пароль — минимум 6 символов"; return; }
      if (!await ensureFresh()) return;
      try { await api("/auth/v1/user", {method:"PUT", body: JSON.stringify({password})});
            document.getElementById("sbNewPass").value = ""; syncEl.textContent = "Пароль задан. Теперь можно входить по email и паролю."; }
      catch(e){ syncEl.textContent = "Не удалось задать пароль: " + e.message; }
    };
    document.getElementById("sbOut").onclick = () => { session = null; lsSet(SES, null); renderSync(); };
  }
}

// Magic link return: #access_token=...&refresh_token=...
(function(){
  if (!location.hash.includes("access_token=")) return;
  const p = new URLSearchParams(location.hash.slice(1));
  try { takeSession({access_token: p.get("access_token"), refresh_token: p.get("refresh_token"), expires_in: +p.get("expires_in")}); } catch(e){}
  history.replaceState(null, "", location.pathname + location.search);
})();

renderSync();
pull();
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

// Backup to file
document.getElementById("exp").onclick = () => {
  const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "zaryadka-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("imp").onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t); if (!d || !d.days) throw 0;
    state.days = merge(d.days); save(); render();
    syncEl.textContent = "Данные восстановлены из копии";
  }).catch(() => syncEl.textContent = "Этот файл не похож на копию трекера");
  ev.target.value = "";
};

render();

// ===== Автообновление (иконка на экране «Домой» не перезагружает страницу сама) =====
const APP_VER = document.querySelector('meta[name="app-version"]').content;
document.getElementById("appVer").innerHTML = `Версия ${APP_VER} · <a href="#" id="chkUpd" style="color:inherit">проверить обновления</a>`;
async function checkUpdate(manual){
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), {cache: "no-store"});
    const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
    if (!m) return;
    if (m[1] !== APP_VER) {
      const key = "upd-tried-" + m[1];
      if (!manual && sessionStorage.getItem(key)) return;   // защита от зацикливания
      sessionStorage.setItem(key, "1");
      try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
      const t = document.getElementById("toast"); t.innerHTML = "Загружаю новую версию…"; t.classList.add("show");
      setTimeout(() => location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])), 400);
    } else if (manual) {
      const t = document.getElementById("toast"); t.innerHTML = "У вас последняя версия"; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }
  } catch(e){}
}
document.getElementById("chkUpd").onclick = ev => { ev.preventDefault(); checkUpdate(true); };
checkUpdate(false);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });
// Roll over to the new day if the page stays open overnight
let openedOn = todayISO();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const t = todayISO();
  if (t !== openedOn) { if (cur === openedOn) cur = t; openedOn = t; render(); }
});
</script>
